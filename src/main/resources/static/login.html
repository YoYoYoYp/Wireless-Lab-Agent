<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 无线实验室智能体</title>
    <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <h1>无线实验室智能体</h1>
            <p class="auth-subtitle">Java 控制智能体 × Python/UHD 硬件智能体</p>
            <div class="auth-capabilities" aria-label="系统能力">
                <span>RAG 知识检索</span>
                <span>USRP 实验控制</span>
                <span>设备实时态势</span>
            </div>

            <div class="auth-tabs">
                <button class="tab active" data-tab="login">登录</button>
                <button class="tab" data-tab="register">注册</button>
            </div>

            <form id="loginForm" class="auth-form">
                <input type="text" id="loginUsername" placeholder="用户名" required autocomplete="username">
                <input type="password" id="loginPassword" placeholder="密码" required autocomplete="current-password">
                <button type="submit">登录</button>
                <p class="auth-error" id="loginError"></p>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <input type="text" id="regUsername" placeholder="用户名" required autocomplete="username">
                <input type="password" id="regPassword" placeholder="密码" required autocomplete="new-password">
                <button type="submit">注册</button>
                <p class="auth-error" id="regError"></p>
            </form>
        </div>
    </div>
    <script src="js/api.js?v=4"></script>
    <script src="js/auth.js?v=4"></script>
</body>
</html>
